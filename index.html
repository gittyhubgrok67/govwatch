<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Governance Watch, Memento Research</title>
<meta name="description" content="Private tracker by Memento Research.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css?v=c2c23433">
<script>(function(){try{var t=localStorage.getItem("gw-theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
</head>
<body>
<div class="gate" id="gate">
  <button class="iconbtn theme" id="gateTheme" type="button" aria-label="Toggle light or dark theme">Theme</button>
  <form class="box" id="gateForm" autocomplete="on">
    <img class="logo-dark" src="assets/logo-dark-bg.png" alt="Memento Research" width="214" height="26">
    <img class="logo-light" src="assets/logo-light-bg.png" alt="Memento Research" width="214" height="26">
    <div class="kicker">Private, members only</div>
    <h1>Governance Watch</h1>
    <p>This tracker is encrypted. Enter the password to unlock it on this device.</p>
    <input type="text" name="username" value="govwatch" autocomplete="username" class="sr" tabindex="-1" aria-hidden="true">
    <div class="field"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required autofocus></div>
    <div class="row2">
      <label class="chk"><input type="checkbox" id="remember"> Remember this device</label>
      <button class="btn primary" id="unlock" type="submit">Unlock</button>
    </div>
    <div class="err" id="gateErr" role="alert"></div>
    <div class="foot">Encrypted with AES-256-GCM and decrypted in your browser</div>
  </form>
</div>
<div id="app" class="hidden"></div>
<noscript><p style="padding:24px;font-family:monospace">JavaScript is required to decrypt this page.</p></noscript>
<script src="assets/gate.js?v=c2c23433"></script>
</body>
</html>
